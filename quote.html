<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a Quote | HI TECH SAVVY'S</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #00153d; color: #fff; min-height: 100vh; padding: 40px 7%; }
    .quote-page { max-width: 760px; margin: 0 auto; background: #fff; color: #00153d; padding: clamp(28px, 6vw, 64px); border-radius: 12px; }
    .quote-page h1 { font-size: clamp(36px, 7vw, 68px); line-height: 1.1; margin-bottom: 16px; }
    .quote-page p { margin-bottom: 28px; }
    .quote-form { display: grid; gap: 18px; }
    .quote-form label { font-weight: 600; }
    .quote-form input, .quote-form textarea { width: 100%; margin-top: 7px; padding: 14px; border: 1px solid #b8c2d1; border-radius: 6px; font: inherit; }
    .quote-form .field-error { display: none; margin-top: 6px; color: #d93025; font-size: .82rem; font-weight: 600; }
    .quote-form .field-error.show { display: block; }
    .quote-form .invalid { border-color: #d93025; }
    .quote-form textarea { resize: vertical; }
    .quote-form button { border: 0; cursor: pointer; font: inherit; font-weight: 700; background: #0d6efd; color: #fff; padding: 15px 24px; border-radius: 8px; }
    .quote-form button:disabled { opacity: .6; cursor: wait; }
    .form-note { min-height: 24px; font-weight: 600; }
    .back-link { color: #0d6efd; font-weight: 600; }
    .hidden-honeypot { display: none; }
  </style>
</head>
<body>
  <main class="quote-page">
    <a class="back-link" href="index.html">← Back to website</a>
    <h1>Request a quote</h1>
    <p>Tell us what you need and our engineering team will get back to you.</p>
    
    <!-- Formspree endpoint configured with your email & form ID -->
    <form class="quote-form" id="contactForm" action="https://formspree.io/f/xoejvjwr" method="POST" novalidate>
      <!-- Hidden field to redirect back to a thank-you page (optional) -->
      <input type="hidden" name="_next" value="https://your-website.com/thanks.html">
      <!-- Honeypot field to prevent spam (Formspree will ignore if filled) -->
      <input type="text" name="_gotcha" class="hidden-honeypot" tabindex="-1" autocomplete="off">
      
      <label for="cf-name">Your name
        <input id="cf-name" name="name" type="text" required autocomplete="name">
        <small class="field-error" id="cf-name-error">Fill in the information</small>
      </label>

      <label for="cf-email">Email address
        <input id="cf-email" name="email" type="email" required autocomplete="email">
        <small class="field-error" id="cf-email-error">Fill in the information</small>
      </label>

      <label for="cf-phone">Phone number
        <input id="cf-phone" name="phone" type="tel" required autocomplete="tel" placeholder="067 267 9529">
        <small class="field-error" id="cf-phone-error">Fill in the information</small>
      </label>

      <label for="cf-msg">Project requirements
        <textarea id="cf-msg" name="message" rows="7" required placeholder="Tell us about your project"></textarea>
        <small class="field-error" id="cf-msg-error">Fill in the information</small>
      </label>

      <button type="submit" id="submitBtn">Send quote request</button>
      <p class="form-note" id="formNote" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (function() {
      const form = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const formNote = document.getElementById('formNote');
      
      // Fields and their error elements
      const fields = [
        { input: document.getElementById('cf-name'), error: document.getElementById('cf-name-error') },
        { input: document.getElementById('cf-email'), error: document.getElementById('cf-email-error') },
        { input: document.getElementById('cf-phone'), error: document.getElementById('cf-phone-error') },
        { input: document.getElementById('cf-msg'), error: document.getElementById('cf-msg-error') }
      ];

      // Function to validate a single field
      function validateField(field) {
        const { input, error } = field;
        const value = input.value.trim();
        let isValid = true;

        // Required check
        if (!value) {
          isValid = false;
        } else if (input.type === 'email') {
          // Basic email pattern: something@something.something
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(value)) {
            isValid = false;
          }
        }

        if (!isValid) {
          input.classList.add('invalid');
          error.classList.add('show');
        } else {
          input.classList.remove('invalid');
          error.classList.remove('show');
        }
        return isValid;
      }

      // Validate all fields, return true if all valid
      function validateAll() {
        let allValid = true;
        fields.forEach(field => {
          const valid = validateField(field);
          if (!valid) allValid = false;
        });
        return allValid;
      }

      // Clear validation state on input (optional)
      fields.forEach(field => {
        field.input.addEventListener('input', function() {
          // Remove error only if the field becomes valid (or empty, but required)
          // We'll just clear the error styling for better UX, but validation happens on submit
          if (field.input.value.trim() !== '') {
            // If it's email, we might still keep red until valid? Better to clear error on input to be friendly.
            // But we'll clear the red only if it's not empty, and let submit re-validate.
            // However, to give immediate feedback, we can re-validate on input if we want.
            // Simple approach: remove the invalid class on input, and hide error; submit will re-show if needed.
            field.input.classList.remove('invalid');
            field.error.classList.remove('show');
          }
        });
      });

      // Handle form submission
      form.addEventListener('submit', function(event) {
        event.preventDefault(); // We'll handle via fetch for better UX

        // Clear previous status message
        formNote.textContent = '';
        formNote.style.color = '#00153d'; // default

        // Validate all fields
        if (!validateAll()) {
          formNote.textContent = 'Please fill in all fields correctly.';
          formNote.style.color = '#d93025';
          return;
        }

        // Disable button to prevent multiple submissions
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
        formNote.textContent = '';

        // Gather form data
        const formData = new FormData(form);

        // Send via fetch to Formspree
        fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json' // So Formspree returns JSON
          }
        })
        .then(response => {
          if (response.ok) {
            // Success
            formNote.textContent = '✅ Thank you! Your quote request has been sent. We will get back to you shortly.';
            formNote.style.color = '#0d6efd';
            form.reset(); // Clear the form
            // Optionally clear validation classes
            fields.forEach(f => {
              f.input.classList.remove('invalid');
              f.error.classList.remove('show');
            });
          } else {
            // Server responded with error
            return response.json().then(data => {
              if (data.errors && data.errors.length) {
                throw new Error(data.errors.map(e => e.message).join(', '));
              } else {
                throw new Error('Form submission failed. Please try again.');
              }
            });
          }
        })
        .catch(error => {
          console.error('Error:', error);
          formNote.textContent = '❌ ' + (error.message || 'Something went wrong. Please try again later.');
          formNote.style.color = '#d93025';
        })
        .finally(() => {
          // Re-enable button
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send quote request';
        });
      });
    })();
  </script>
</body>
</html>
